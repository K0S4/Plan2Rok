    <style>
        :root {
            /* Tło i główny tekst - Dark Mode */
            --bg: #0f172a;               /* Bardzo ciemny granat (tło strony) */
            --card-bg: #1e293b;          /* Ciemny granat (tło kafelków) */
            --filter-bg: #0b1120;        /* Jeszcze ciemniejsze tło filtrów */
            --text: #f8fafc;             /* Niemal biały (główny tekst) */
            --text-muted: #94a3b8;       /* Szaro-niebieski (tekst poboczny np. sale) */
            --border-color: #334155;     
            
            /* Główne akcenty */
            --primary: #818cf8;          /* Fioletowo-niebieski (Nagłówki dni) */
            --primary-text: #1e1b4b;     /* Ciemny tekst nagłówka dla kontrastu */
            --accent-time: #fbbf24;      /* Bursztynowy/Złoty (Godziny zajęć) */
            --border-radius: 14px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        h1 {
            font-size: 26px;
            color: var(--text);
            margin-top: 0;
            text-align: center;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }
        
        /* HORYZONTALNY UKŁAD FILTRÓW */
        .filters-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            background: var(--filter-bg);
            padding: 20px;
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
        }
        .filter-group {
            flex: 1 1 150px;
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 12px;
            color: #cbd5e1;
        }
        select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 13px;
            background: var(--card-bg);
            color: var(--text);
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.25);
        }
        
        /* WYGLĄD PLANU */
        .day-header {
            background: var(--primary);
            color: var(--primary-text);
            padding: 12px 18px;
            border-radius: 8px;
            margin-top: 35px;
            font-weight: bold;
            font-size: 16px;
            position: sticky;
            top: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 10;
        }
        
        .class-card {
            padding: 18px 20px;
            margin-top: 15px;
            border-radius: 0 10px 10px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .class-card:hover {
            transform: translateX(4px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        }

        /* 6 MOTYWÓW KOLORYSTYCZNYCH (PASTELE NA CIEMNYM TLE) */
        
        /* 1. Cały rok (Wykłady) - Fiolet/Indigo */
        .card-caly-rok { border-left: 5px solid #a78bfa; background: linear-gradient(90deg, rgba(167, 139, 250, 0.1) 0%, var(--card-bg) 100%); }
        .badge-caly-rok { background: rgba(167, 139, 250, 0.2); color: #c4b5fd; }

        /* 2. Kliniczne/Seminaryjne - Błękit/Sky */
        .card-grupa { border-left: 5px solid #38bdf8; background: linear-gradient(90deg, rgba(56, 189, 248, 0.1) 0%, var(--card-bg) 100%); }
        .badge-grupa { background: rgba(56, 189, 248, 0.2); color: #7dd3fc; }

        /* 3. Telemedycyna - Mięta/Emerald */
        .card-tele { border-left: 5px solid #34d399; background: linear-gradient(90deg, rgba(52, 211, 153, 0.1) 0%, var(--card-bg) 100%); }
        .badge-tele { background: rgba(52, 211, 153, 0.2); color: #6ee7b7; }

        /* 4. Język Migowy - Bursztyn/Amber */
        .card-migowy { border-left: 5px solid #fbbf24; background: linear-gradient(90deg, rgba(251, 191, 36, 0.1) 0%, var(--card-bg) 100%); }
        .badge-migowy { background: rgba(251, 191, 36, 0.2); color: #fcd34d; }

        /* 5. Pracownie (Literowe) - Róż/Rose */
        .card-praktyczne { border-left: 5px solid #f43f5e; background: linear-gradient(90deg, rgba(244, 63, 94, 0.1) 0%, var(--card-bg) 100%); }
        .badge-praktyczne { background: rgba(244, 63, 94, 0.2); color: #fda4af; }

        /* 6. Lektorat Angielski - Limonka/Zielony */
        .card-lektorat { border-left: 5px solid #a3e635; background: linear-gradient(90deg, rgba(163, 230, 53, 0.1) 0%, var(--card-bg) 100%); }
        .badge-lektorat { background: rgba(163, 230, 53, 0.2); color: #bef264; }

        /* Pozostałe elementy karty */
        .badges {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-forma {
            background: #334155;
            color: #cbd5e1;
        }

        .time {
            color: var(--accent-time);
            font-weight: 800;
            font-size: 17px;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }
        .title {
            font-weight: 700;
            margin: 8px 0;
            color: var(--text);
            font-size: 17px;
            line-height: 1.5;
        }
        .details {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-top: 12px;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
        }
        .empty-state {
            text-align: center;
            color: var(--text-muted);
            margin-top: 50px;
            font-style: italic;
            font-size: 15px;
        }
        
        /* Stopka informacyjna */
        .footer-disclaimer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            text-align: center;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>

        // Zależność grup arabskich do rzymskich na UJCM
        const clinicalToRoman = {
            '1': 'I',   '2': 'I',
            '3': 'II',  '4': 'II',
            '5': 'III', '6': 'III',
            '7': 'IV',  '8': 'IV',
            '9': 'V',   '10': 'V',
            '11': 'VI', '12': 'VI',
            '13': 'VII','14': 'VII',
            '15': 'VIII','16': 'VIII',
            '17': 'IX', '18': 'IX',
            '19': 'X',  '20': 'X'
        };

        // Tablica pomagająca w odpowiednim sortowaniu rzymskich numerów (żeby IX nie było przed V)
        const romanSortOrder = {
            'I': 1, 'II': 2, 'III': 3, 'IV': 4, 'V': 5, 
            'VI': 6, 'VII': 7, 'VIII': 8, 'IX': 9, 'X': 10
        };

        function populateSelect(elementId, categoryName) {
            const select = document.getElementById(elementId);
            let groups = [...new Set(
                data.filter(item => item.Kategoria === categoryName)
                    .map(item => String(item.Grupa_Pojedyncza).trim())
            )];

            // Właściwe sortowanie rzymskich i arabskich
            if (categoryName === 'Lektorat (Angielski)' || categoryName === 'Rzymskie (Seminaryjne)') {
                groups.sort((a, b) => (romanSortOrder[a] || 99) - (romanSortOrder[b] || 99));
            } else {
                groups.sort((a, b) => a.localeCompare(b, undefined, {numeric: true, sensitivity: 'base'}));
            }

            groups.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g;
                opt.textContent = "Grupa " + g;
                select.appendChild(opt);
            });
        }

        // Inicjalizacja list wyboru
        if (data && Array.isArray(data) && data.length > 0) {
            populateSelect('kliniczne', 'Arabskie (Kliniczne)');
            populateSelect('praktyczne', 'Literowe (Praktyczne)');
            populateSelect('lektorat', 'Lektorat (Angielski)');
            populateSelect('telemedycyna', 'Telemedycyna (T)');
            populateSelect('migowy', 'Język Migowy (M)');
            
            const selects = document.querySelectorAll('.filter-select');
            selects.forEach(sel => sel.addEventListener('change', updateSchedule));
        }

        // Naprawa sortowania godzin (np. żeby 7:15 było zawsze przed 10:15)
        function parseTime(timeStr) {
            const match = timeStr.match(/(\d{1,2})[:.](\d{2})/);
            if (match) {
                return parseInt(match[1]) * 60 + parseInt(match[2]);
            }
            return 9999;
        }

        function updateSchedule() {
            const selectedKliniczne = document.getElementById('kliniczne').value;
            const selectedTelemedycyna = document.getElementById('telemedycyna').value;
            const selectedMigowy = document.getElementById('migowy').value;
            const selectedPraktyczne = document.getElementById('praktyczne').value;
            const selectedLektorat = document.getElementById('lektorat').value;

            const scheduleDiv = document.getElementById('schedule');
            scheduleDiv.innerHTML = '';

            if (!selectedKliniczne) {
                scheduleDiv.innerHTML = '<div class="empty-state">Wybierz swoją grupę kliniczną powyżej, aby zobaczyć plan.</div>';
                return;
            }

            const derivedRoman = clinicalToRoman[selectedKliniczne];

            const filtered = data.filter(item => {
                const cat = item.Kategoria;
                const grp = String(item.Grupa_Pojedyncza).trim();

                // Wykłady główne i zajęcia grupy klinicznej/seminaryjnej
                if (cat === 'Cały rok') return true;
                if (cat === 'Arabskie (Kliniczne)' && grp === selectedKliniczne) return true;
                if (cat === 'Rzymskie (Seminaryjne)' && grp === derivedRoman) return true;

                // Moduły do wyboru i niezależne
                if (cat === 'Telemedycyna (T)' && grp === selectedTelemedycyna) return true;
                if (cat === 'Język Migowy (M)' && grp === selectedMigowy) return true;
                if (cat === 'Literowe (Praktyczne)' && grp === selectedPraktyczne) return true;
                if (cat === 'Lektorat (Angielski)' && grp === selectedLektorat) return true;

                return false;
            });

            if (filtered.length === 0) {
                scheduleDiv.innerHTML = '<div class="empty-state">Brak zajęć dla podanych kryteriów.</div>';
                return;
            }

            const byDate = {};
            filtered.forEach(item => {
                if (!byDate[item.Data_ISO]) byDate[item.Data_ISO] = [];
                byDate[item.Data_ISO].push(item);
            });

            Object.keys(byDate).sort().forEach(date => {
                // SORTOWANIE CHRONOLOGICZNE W OBRĘBIE DNIA!
                byDate[date].sort((a, b) => parseTime(a.Godziny) - parseTime(b.Godziny));
                
                // Formatyzacja daty na ładny polski (np. Poniedziałek, 12 października)
                let displayDate = date;
                try {
                    const dateObj = new Date(date);
                    const options = { weekday: 'long', day: 'numeric', month: 'long' };
                    const formatted = dateObj.toLocaleDateString('pl-PL', options);
                    displayDate = formatted.charAt(0).toUpperCase() + formatted.slice(1);
                } catch(e) {
                    const parts = date.split('-');
                    if (parts.length === 3) displayDate = `${parts[2]}.${parts[1]}.${parts[0]}`;
                }

                scheduleDiv.innerHTML += `<div class="day-header">📅 ${displayDate}</div>`;

                byDate[date].forEach(cls => {
                    const cleanTitle = String(cls.Przedmiot).replace(/\n/g, '<br>');
                    const cleanPlace = String(cls.Miejsce).replace(/\n/g, ' ');
                    const cleanTeacher = cls.Prowadzacy ? String(cls.Prowadzacy).replace(/\n/g, ' ') : '';
                    const cleanForm = cls.Forma ? String(cls.Forma).replace(/\n/g, ' ') : '';
                    
                    // Rozpoznawanie motywu kolorystycznego na bazie Kategorii UJCM
                    const cat = String(cls.Kategoria).trim();
                    let cardThemeClass = 'card-grupa';
                    let badgeThemeClass = 'badge-grupa';
                    
                    if (cat === 'Cały rok') {
                        cardThemeClass = 'card-caly-rok'; badgeThemeClass = 'badge-caly-rok';
                    } else if (cat === 'Telemedycyna (T)') {
                        cardThemeClass = 'card-tele'; badgeThemeClass = 'badge-tele';
                    } else if (cat === 'Język Migowy (M)') {
                        cardThemeClass = 'card-migowy'; badgeThemeClass = 'badge-migowy';
                    } else if (cat === 'Literowe (Praktyczne)') {
                        cardThemeClass = 'card-praktyczne'; badgeThemeClass = 'badge-praktyczne';
                    } else if (cat === 'Lektorat (Angielski)') {
                        cardThemeClass = 'card-lektorat'; badgeThemeClass = 'badge-lektorat';
                    }
                    
                    const groupLabelText = cat === 'Cały rok' ? '👥 Cały rok' : `👥 Grupa ${cls.Grupa}`;

                    scheduleDiv.innerHTML += `
                        <div class="class-card ${cardThemeClass}">
                            <div class="badges">
                                ${cleanForm ? `<span class="badge badge-forma">${cleanForm}</span>` : ''}
                                <span class="badge ${badgeThemeClass}">${groupLabelText}</span>
                            </div>
                            <div class="time">⏰ ${cls.Godziny}</div>
                            <div class="title">${cleanTitle}</div>
                            <div class="details">
                                📍 ${cleanPlace}<br>
                                ${cleanTeacher ? '👨‍🏫 ' + cleanTeacher : ''}
                            </div>
                        </div>
                    `;
                });
            });
        }
    </script>
</body>
</html>
